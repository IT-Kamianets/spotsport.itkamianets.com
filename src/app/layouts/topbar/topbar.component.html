<header
	class="relative z-50 border-b border-[var(--c-border)] bg-[var(--c-bg-secondary)]/95 backdrop-blur supports-[backdrop-filter]:bg-[var(--c-bg-secondary)]/80"
>
	<div
		class="mx-auto flex min-h-16 w-full max-w-[var(--container)] items-center justify-between gap-4 overflow-visible px-4 py-3 sm:px-6"
	>
		<!-- Brand Logo -->
		<a
			[translate]="{ ariaLabel: 'Go to homepage' }"
			class="inline-flex items-center gap-2.5 shrink-0"
			routerLink="/home"
			(click)="closeMobileNav()"
		>
			<img
				class="h-9 w-auto"
				[translate]="{ alt: 'SpotSport logo' }"
				ngSrc="logo.png"
				width="132"
				height="40"
				priority
			/>
			@if (company().name) {
				<span class="text-base font-bold tracking-tight text-[var(--c-text-strong)]">
					{{ company().name }}
				</span>
			}
		</a>

		<!-- Desktop Navigation Menu (All MVP Pages) -->
		<nav class="hidden lg:flex items-center gap-1" aria-label="Main Navigation">
			@for (page of navPages; track page.id) {
				<a
					[routerLink]="page.path"
					routerLinkActive="bg-[var(--c-primary)]/10 text-[var(--c-primary)] font-semibold shadow-xs"
					[routerLinkActiveOptions]="{ exact: false }"
					class="theme-interactive inline-flex items-center gap-1.5 rounded-xl px-3 py-1.5 text-xs font-medium text-[var(--c-text)] hover:bg-[var(--c-bg-primary)] hover:text-[var(--c-text-strong)]"
				>
					<span class="material-symbols-outlined text-[16px]">{{ page.icon }}</span>
					<span>{{ page.title }}</span>
				</a>
			}
		</nav>

		<!-- Mobile Navigation Menu Toggle -->
		<div class="flex items-center gap-2 shrink-0 lg:hidden">
			<button
				type="button"
				(click)="toggleMobileNav()"
				class="theme-interactive theme-focus inline-flex h-11 w-11 items-center justify-center"
				[class]="isProfilePage() && !mobileNavOpen()
					? 'rounded-2xl border border-[var(--c-primary)] bg-[var(--c-primary)] text-white shadow-sm hover:bg-[var(--c-primary-hover)]'
					: (mobileNavOpen()
						? 'rounded-2xl border border-[var(--c-primary)] bg-[var(--c-primary)] text-white shadow-sm'
						: 'rounded-full border border-[var(--c-border)] bg-[var(--c-bg-primary)] text-[var(--c-text-strong)] hover:bg-[var(--c-bg-tertiary)]')"
				[attr.aria-expanded]="mobileNavOpen()"
				[attr.aria-label]="isProfilePage() ? 'Profile navigation menu' : 'Toggle navigation menu'"
			>
				<span
					class="material-symbols-outlined"
					[class]="isProfilePage() && !mobileNavOpen() ? 'text-[24px]' : 'text-[22px]'"
				>
					{{ mobileNavOpen() ? 'close' : (isProfilePage() ? 'account_circle' : 'menu') }}
				</span>
			</button>
		</div>
	</div>

	<!-- Mobile / Compact Navigation Drawer -->
	@if (mobileNavOpen()) {
		<div
			class="border-t border-[var(--c-border)] bg-[var(--c-bg-secondary)] px-4 py-4 shadow-lg lg:hidden"
		>
			<p class="px-2 text-xs font-semibold uppercase tracking-wider text-[var(--c-text-muted)]">
				SpotSport MVP Pages
			</p>
			<div class="mt-2 grid grid-cols-1 gap-1.5 sm:grid-cols-2">
				@for (page of navPages; track page.id) {
					<a
						[routerLink]="page.path"
						(click)="closeMobileNav()"
						routerLinkActive="bg-[var(--c-primary)]/10 text-[var(--c-primary)] font-semibold border-[var(--c-primary)]"
						class="theme-interactive flex items-center justify-between rounded-xl border border-[var(--c-border)] bg-[var(--c-bg-primary)] p-3 text-sm text-[var(--c-text-strong)] hover:border-[var(--c-primary)]"
					>
						<div class="flex items-center gap-3">
							<span class="flex h-8 w-8 items-center justify-center rounded-lg bg-[var(--c-bg-secondary)] text-[var(--c-primary)] shadow-xs">
								<span class="material-symbols-outlined text-[18px]">{{ page.icon }}</span>
							</span>
							<div>
								<p class="font-medium leading-none">{{ page.title }}</p>
								<p class="mt-1 text-[11px] text-[var(--c-text-muted)]">{{ page.summary }}</p>
							</div>
						</div>
						<span class="text-xs font-mono font-semibold text-[var(--c-text-muted)]">
							0{{ page.number }}
						</span>
					</a>
				}
			</div>
		</div>
	}
</header>
