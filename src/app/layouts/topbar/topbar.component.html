<header
	class="relative z-50 border-b border-[var(--c-border)] bg-[var(--c-bg-secondary)]/95 backdrop-blur supports-[backdrop-filter]:bg-[var(--c-bg-secondary)]/80"
>
	<div
		class="mx-auto flex min-h-16 w-full max-w-[var(--container)] items-center justify-between gap-4 overflow-visible px-4 py-3 sm:px-6"
	>
		<!-- Brand Logo -->
		<a
			[translate]="{ ariaLabel: 'Go to homepage' }"
			class="inline-flex items-center gap-2.5 shrink-0"
			routerLink="/home"
		>
			<img
				class="h-9 w-auto"
				[translate]="{ alt: 'SpotSport logo' }"
				ngSrc="logo.png"
				width="132"
				height="40"
				priority
			/>
			@if (company().name) {
				<span class="text-base font-bold tracking-tight text-[var(--c-text-strong)]">
					{{ company().name }}
				</span>
			}
		</a>

		<!-- Desktop Navigation Menu (All MVP Pages & External Links) -->
		<nav class="hidden lg:flex items-center gap-1.5" aria-label="Main Navigation">
			@for (page of navPages; track page.id) {
				<a
					[routerLink]="page.path"
					routerLinkActive="bg-[var(--c-primary)]/10 text-[var(--c-primary)] font-semibold shadow-xs"
					[routerLinkActiveOptions]="{ exact: false }"
					class="theme-interactive inline-flex items-center gap-1.5 rounded-xl px-3 py-1.5 text-xs font-medium text-[var(--c-text)] hover:bg-[var(--c-bg-primary)] hover:text-[var(--c-text-strong)] transition-colors"
				>
					<span class="material-symbols-outlined text-[16px]">{{ page.icon }}</span>
					<span>{{ getPageTitle(page.id, page.title) }}</span>
				</a>
			}

			<a
				[href]="githubRepoUrl"
				target="_blank"
				rel="noopener noreferrer"
				class="theme-interactive inline-flex items-center gap-1.5 rounded-xl px-3 py-1.5 text-xs font-medium text-[var(--c-text)] hover:bg-[var(--c-bg-primary)] hover:text-[var(--c-text-strong)] transition-colors"
				[title]="ts.t('nav.githubTitle')"
			>
				<svg class="h-4 w-4 fill-current shrink-0" viewBox="0 0 24 24" aria-hidden="true">
					<path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
				</svg>
				<span>{{ ts.t('nav.github') }}</span>
				<span class="material-symbols-outlined text-[13px] text-[var(--c-text-muted)]">open_in_new</span>
			</a>

			<!-- Language Dropdown Switcher ("English" / "Українська") -->
			<div class="relative ml-2 flex items-center">
				<button
					type="button"
					(click)="toggleLanguageMenu()"
					class="theme-interactive theme-focus inline-flex h-9 items-center gap-2 rounded-xl border border-[var(--c-border)] bg-[var(--c-bg-primary)] px-2.5 py-1 text-xs font-semibold text-[var(--c-text-strong)] hover:border-[var(--c-primary)] shadow-xs transition-colors cursor-pointer"
					[attr.aria-expanded]="languageMenuOpen()"
					[attr.aria-label]="ts.t('lang.openMenu')"
				>
					<img
						class="h-4 w-5 rounded-[2px] border border-black/10 object-cover"
						[alt]="ts.currentLangOption().nativeName"
						[src]="ts.currentLangOption().flagSrc"
						width="20"
						height="14"
					/>
					<span>{{ ts.currentLangOption().nativeName }}</span>
					<span class="material-symbols-outlined text-[16px] text-[var(--c-text-muted)]" aria-hidden="true">
						{{ languageMenuOpen() ? 'expand_less' : 'expand_more' }}
					</span>
				</button>

				@if (languageMenuOpen()) {
					<div
						class="absolute right-0 top-[calc(100%+0.5rem)] z-50 min-w-44 overflow-hidden rounded-2xl border border-[var(--c-border)] bg-[var(--c-bg-primary)] p-1.5 shadow-[var(--shadow-md)]"
					>
						@for (lang of ts.availableLanguages; track lang.code) {
							<button
								type="button"
								(click)="selectLanguage(lang.code)"
								class="theme-interactive theme-focus flex w-full items-center gap-2.5 rounded-xl px-3 py-2 text-left text-xs font-semibold transition-colors cursor-pointer"
								[class]="ts.currentLang() === lang.code ? 'bg-[var(--c-primary)]/10 text-[var(--c-primary)]' : 'text-[var(--c-text)] hover:bg-[var(--c-bg-secondary)]'"
							>
								<img
									class="h-4 w-5 rounded-[2px] border border-black/10 object-cover"
									[alt]="lang.nativeName"
									[src]="lang.flagSrc"
									width="20"
									height="14"
								/>
								<span>{{ lang.nativeName }}</span>
								@if (ts.currentLang() === lang.code) {
									<span class="material-symbols-outlined ml-auto text-[16px] text-[var(--c-primary)]">check</span>
								}
							</button>
						}
					</div>
				}
			</div>
		</nav>

		<!-- Mobile Header Controls (Language Toggle + Profile Link) -->
		<div class="flex items-center gap-2 shrink-0 lg:hidden">
			<!-- Mobile Language Quick Switcher -->
			<button
				type="button"
				(click)="selectLanguage(ts.getNextLanguage().code)"
				class="theme-interactive theme-focus inline-flex h-10 items-center gap-1.5 rounded-xl border border-[var(--c-border)] bg-[var(--c-bg-primary)] px-2.5 py-1 text-xs font-semibold text-[var(--c-text-strong)] hover:border-[var(--c-primary)] shadow-xs cursor-pointer"
				[title]="ts.t('lang.switch') + ' ' + ts.getNextLanguage().nativeName"
			>
				<img
					class="h-3.5 w-5 rounded-[2px] border border-black/10 object-cover"
					[alt]="ts.currentLangOption().nativeName"
					[src]="ts.currentLangOption().flagSrc"
					width="20"
					height="14"
				/>
				<span class="text-[11px] font-bold">{{ ts.currentLang().toUpperCase() }}</span>
			</button>

			<!-- Mobile Profile Button -->
			<a
				routerLink="/profile"
				class="theme-interactive theme-focus inline-flex h-10 w-10 items-center justify-center rounded-xl border transition-colors cursor-pointer"
				[class]="isProfilePage()
					? 'border-[var(--c-primary)] bg-[var(--c-primary)] text-white shadow-xs'
					: 'border-[var(--c-border)] bg-[var(--c-bg-primary)] text-[var(--c-text-strong)] hover:border-[var(--c-primary)] shadow-xs'"
				[attr.aria-label]="ts.t('nav.profile')"
				[title]="ts.t('nav.profile')"
			>
				<span class="material-symbols-outlined text-[22px]" aria-hidden="true">account_circle</span>
			</a>
		</div>
	</div>
</header>
